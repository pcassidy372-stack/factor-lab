name: Factor Lab reliability tests (no deployments)
on:
  push:
    branches: [repair/factor-lab-reliability-20260911]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: factorlab_ci
          POSTGRES_USER: factorlab_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U factorlab_ci -d factorlab_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      FACTORLAB_TEST_DATABASE_URL: postgresql://factorlab_ci:disposable-ci-only@127.0.0.1:5432/factorlab_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q factorlab scripts tests
      - run: python -m pytest --junitxml=test-results.xml
